apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: falzo
  labels:
    app.kubernetes.io/name: falzo
    app.kubernetes.io/part-of: falzo
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "75"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - game.example.com
      secretName: falzo-tls
  rules:
    - host: game.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: falzo-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: falzo-frontend
                port:
                  number: 3000
