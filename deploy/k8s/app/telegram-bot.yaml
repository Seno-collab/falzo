apiVersion: apps/v1
kind: Deployment
metadata:
  name: falzo-telegram-bot
  labels:
    app.kubernetes.io/name: falzo-telegram-bot
    app.kubernetes.io/part-of: falzo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: falzo-telegram-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falzo-telegram-bot
        app.kubernetes.io/part-of: falzo
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telegram-bot
          image: falzo/backend:0.0.0
          command: ["/app/falzo-telegram-bot"]
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: falzo-config
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: falzo-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: falzo-secrets
                  key: TELEGRAM_CHAT_ID
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
