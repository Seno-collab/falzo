apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: falzo
resources:
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
images:
  - name: falzo/backend
    newName: ghcr.io/your-org/falzo-backend
    newTag: replace-me
  - name: falzo/frontend
    newName: ghcr.io/your-org/falzo-frontend
    newTag: replace-me
