apiVersion: batch/v1
kind: Job
metadata:
  name: falzo-migrate
  labels:
    app.kubernetes.io/name: falzo-migrate
    app.kubernetes.io/part-of: falzo
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falzo-migrate
        app.kubernetes.io/part-of: falzo
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: falzo/migrate:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - -database=$(DATABASE_URL)
            - up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: falzo-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
