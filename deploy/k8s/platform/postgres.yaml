apiVersion: v1
kind: Service
metadata:
  name: falzo-postgres
  labels:
    app.kubernetes.io/name: falzo-postgres
    app.kubernetes.io/part-of: falzo
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: falzo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falzo-postgres
  labels:
    app.kubernetes.io/name: falzo-postgres
    app.kubernetes.io/part-of: falzo
spec:
  serviceName: falzo-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falzo-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falzo-postgres
        app.kubernetes.io/part-of: falzo
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: falzo-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: falzo-config
                  key: DATABASE_USER_NAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: falzo-secrets
                  key: DATABASE_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
