apiVersion: v1
kind: Service
metadata:
  name: falzo-nats
  labels:
    app.kubernetes.io/name: falzo-nats
    app.kubernetes.io/part-of: falzo
spec:
  selector:
    app.kubernetes.io/name: falzo-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitoring
      port: 8222
      targetPort: monitoring
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: falzo-nats
  labels:
    app.kubernetes.io/name: falzo-nats
    app.kubernetes.io/part-of: falzo
spec:
  serviceName: falzo-nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falzo-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falzo-nats
        app.kubernetes.io/part-of: falzo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitoring
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
