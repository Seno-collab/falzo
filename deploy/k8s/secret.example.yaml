apiVersion: v1
kind: Secret
metadata:
  name: falzo-secrets
  namespace: falzo
type: Opaque
stringData:
  DATABASE_PASSWORD: replace-with-a-strong-database-password
  REDIS_PASSWORD: replace-with-a-strong-redis-password
  JWT_SECRET: replace-with-at-least-32-random-characters
  # URL-encode special characters in the password used by this connection URL.
  DATABASE_URL: postgres://falzo_user:replace-with-url-encoded-password@falzo-postgres:5432/falzo_game_db?sslmode=disable
