services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: falzo_game_db
      POSTGRES_USER: falzo_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falzo_user -d falzo_game_db"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  migration:
    image: ${MIGRATION_IMAGE:?MIGRATION_IMAGE is required}
    profiles: ["tools"]
    command:
      - -database=${DATABASE_URL:?DATABASE_URL is required}
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    environment:
      SERVER_ENV: production
      SERVER_PORT: "8080"
      WEBSOCKET_ORIGIN_PATTERNS: falzo.life
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER_NAME: falzo_user
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_NAME: falzo_game_db
      DATABASE_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: "0"
      REDIS_KEY_PREFIX: falzo:production
      REDIS_POOL_SIZE: "20"
      REDIS_MIN_IDLE_CONNS: "5"
      REDIS_DIAL_TIMEOUT_SECONDS: "5"
      REDIS_READ_TIMEOUT_SECONDS: "3"
      REDIS_WRITE_TIMEOUT_SECONDS: "3"
      NATS_ENABLED: "true"
      NATS_URL: nats://nats:4222
      NATS_ALERT_STREAM: FALZO_ALERTS
      NATS_ALERT_SUBJECT: falzo.alerts.error
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRED_MINUTES: "15"
      JWT_REFRESH_EXPIRED_HOURS: "168"
      JWT_RESET_EXPIRED_MINUTES: "15"
      AUTH_MAX_LOGIN_ATTEMPTS: "5"
      AUTH_LOCK_MINUTES: "15"
      GAME_MAX_PLAYERS_PER_ROOM: "12"
      GAME_ROOM_TIMEOUT_SECONDS: "3600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  telegram-bot:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    entrypoint: ["/app/falzo-telegram-bot"]
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      NATS_ALERT_STREAM: FALZO_ALERTS
      NATS_ALERT_SUBJECT: falzo.alerts.error
      NATS_ALERT_DURABLE: falzo-telegram-error-bot
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required}
    depends_on:
      nats:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  nats_data:
  caddy_data:
  caddy_config:
