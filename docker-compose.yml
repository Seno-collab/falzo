services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    container_name: falzo-postgresql
    restart: unless-stopped
    networks:
      - falzo
    env_file: ./be/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    networks:
      - falzo
    env_file: ./be/.env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:latest
    container_name: falzo-redis
    restart: unless-stopped
    networks:
      - falzo
    env_file: ./be/.env
    ports:
      - "6379:6379"
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: falzo-seaweedfs
    networks:
      - falzo
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs_s3.json
    env_file: ./be/.env
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweedfs_data:/data
      - ./be/secrets/seaweedfs_s3.json:/etc/seaweedfs_s3.json:ro
  api:
    build:
      context: ./be
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - falzo
    env_file: ./be/.env
    environment:
      SEAWEEDFS_BASE_URL: http://seaweedfs:8888
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - redis
      - mongodb
      - seaweedfs
  nginx:
    container_name: falzo-nginx
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    networks:
      - falzo
    ports:
      - "80:80"
    volumes:
      - ./be/nginx/default.conf.template:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

networks:
  falzo:
    driver: bridge

volumes:
  postgres_data:
  redis:
  mongo_data:
  seaweedfs_data:
