services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:latest
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/seaweedfs_s3.json
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweedfs_data:/data
      - ./be/secretkey/seaweedfs_s3.json:/etc/seaweedfs/seaweedfs_s3.json:ro
  api:
    build:
      context: ./be
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./be/.env
    depends_on:
      - postgres
      - redis
      - mongodb
      - seaweedfs
    expose:
      - "8000"
  web:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://api:8000
    environment:
      API_BASE_URL: http://api:8000
    restart: unless-stopped
    env_file: ./fe/.env
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
  redis:
  mongo_data:
  seaweedfs_data:
