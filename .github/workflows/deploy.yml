name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "be/**"
      - "fe/**"
      - "docker-compose.yml"
      - "docker-compose.scale.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: be

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: be/go.mod
          cache-dependency-path: be/go.sum

      - name: Test backend
        run: go test -v ./...

      - name: Build backend
        run: go build -v ./cmd/api

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fe

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

  deploy:
    needs:
      - backend-test
      - frontend-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          API_REPLICAS: ${{ vars.API_REPLICAS || '3' }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${VPS_SSH_KEY}" ] || [ -z "${VPS_APP_DIR}" ]; then
            echo "Missing required deploy secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR"
            exit 1
          fi

          VPS_PORT="${VPS_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT}" "${VPS_HOST}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "VPS_APP_DIR='${VPS_APP_DIR}' API_REPLICAS='${API_REPLICAS}' bash -s" <<'EOF'
            set -euo pipefail

            cd "${VPS_APP_DIR}"

            git fetch origin main
            git checkout main
            git reset --hard origin/main

            docker compose -f docker-compose.yml -f docker-compose.scale.yml config >/dev/null

            docker compose -f docker-compose.yml -f docker-compose.scale.yml build api
            docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --no-deps api

            docker compose -f docker-compose.yml -f docker-compose.scale.yml build nginx
            docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --no-deps nginx

            docker image prune -f
          EOF
