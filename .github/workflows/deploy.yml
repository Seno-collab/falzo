name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "be/**"
      - "fe/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail

          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${VPS_SSH_KEY}" ] || [ -z "${VPS_APP_DIR}" ]; then
            echo "Missing required deploy secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR"
            exit 1
          fi

          VPS_PORT="${VPS_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT}" "${VPS_HOST}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "VPS_APP_DIR='${VPS_APP_DIR}' bash -s" <<'EOF'
            set -euo pipefail

            cd "${VPS_APP_DIR}"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker compose -f docker-compose.yml config >/dev/null
            docker compose -f docker-compose.yml build api web
            docker compose -f docker-compose.yml up -d --no-deps api web
            docker image prune -f
          EOF
