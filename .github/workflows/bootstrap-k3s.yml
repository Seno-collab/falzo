name: Bootstrap Falzo K3s VPS

on:
  workflow_dispatch:

concurrency:
  group: falzo-production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install and prepare K3s
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_APP_DIR"
          [[ "$VPS_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]

          VPS_PORT="${VPS_PORT:-22}"
          echo "VPS_PORT=$VPS_PORT" >> "$GITHUB_ENV"

          install -m 700 -d ~/.ssh
          key_path="$HOME/.ssh/falzo-deploy"
          key_content="$VPS_SSH_KEY"

          # Accept secrets saved with literal \n characters instead of real newlines.
          if [[ "$key_content" != *$'\n'* && "$key_content" == *'\n'* ]]; then
            key_content="${key_content//\\n/$'\n'}"
          fi

          printf '%s\n' "$key_content" | tr -d '\r' > "$key_path"

          # Also accept a base64-encoded private key.
          if ! grep -Eq '^-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----$' "$key_path"; then
            decoded_key="$RUNNER_TEMP/falzo-deploy.decoded"
            if printf '%s' "$VPS_SSH_KEY" | tr -d '\r\n ' | base64 --decode > "$decoded_key" 2>/dev/null \
              && grep -Eq '^-----BEGIN ([A-Z0-9]+ )*PRIVATE KEY-----$' "$decoded_key"; then
              mv "$decoded_key" "$key_path"
            fi
          fi

          chmod 600 "$key_path"

          if ! ssh-keygen -y -P '' -f "$key_path" > /dev/null 2>&1; then
            echo "::error title=Invalid VPS SSH key::VPS_SSH_KEY is not a usable unencrypted private key. Store the complete private key (not the .pub file) as raw multi-line text, text with escaped \\n characters, or base64."
            exit 1
          fi

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          if ! ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -i ~/.ssh/falzo-deploy \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "printf 'SSH access verified\\n'" \
            2>"$RUNNER_TEMP/falzo-ssh-error.log"; then
            ssh_error="$(tail -n 8 "$RUNNER_TEMP/falzo-ssh-error.log" | tr '\r\n' '  ' | sed 's/%/%25/g')"
            echo "::error title=SSH connection failed::$ssh_error"
            exit 1
          fi

      - name: Upload bootstrap manifests
        shell: bash
        run: |
          set -euo pipefail

          remote_dir="$VPS_APP_DIR/bootstrap/$GITHUB_SHA"
          ssh -i ~/.ssh/falzo-deploy -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$remote_dir/platform' '$remote_dir/ci'"
          scp -i ~/.ssh/falzo-deploy -P "$VPS_PORT" \
            deploy/k8s/platform/namespace.yaml \
            "$VPS_USER@$VPS_HOST:$remote_dir/platform/"
          scp -i ~/.ssh/falzo-deploy -P "$VPS_PORT" \
            deploy/k8s/ci/rbac.yaml \
            "$VPS_USER@$VPS_HOST:$remote_dir/ci/"
          echo "REMOTE_DIR=$remote_dir" >> "$GITHUB_ENV"

      - name: Install and configure K3s
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/falzo-deploy -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'EOF'
          set -euo pipefail

          cleanup() {
            rm -rf -- "$REMOTE_DIR"
          }
          trap cleanup EXIT

          if [ "$(id -u)" -eq 0 ]; then
            run_root() { "$@"; }
          elif sudo -n true; then
            run_root() { sudo -n "$@"; }
          else
            echo "The VPS user needs passwordless sudo for K3s bootstrap."
            exit 1
          fi

          diagnose_k3s() {
            if run_root systemctl is-active --quiet k3s \
              && run_root k3s kubectl \
                --kubeconfig /etc/rancher/k3s/k3s.yaml \
                get --raw=/readyz \
                >/dev/null 2>&1; then
              echo "K3s service and API are still healthy; the failure happened after cluster startup."
              return
            fi
            echo "K3s diagnostics after bootstrap failure:"
            run_root systemctl status k3s --no-pager -l || true
            if command -v ss >/dev/null 2>&1; then
              run_root ss -lntp | grep ':6443' || true
            fi
            run_root journalctl -u k3s --since "10 minutes ago" -n 200 --no-pager || true
          }

          finish() {
            exit_code=$?
            trap - EXIT
            if [ "$exit_code" -ne 0 ]; then
              diagnose_k3s
            fi
            cleanup || true
            exit "$exit_code"
          }
          trap finish EXIT

          case "$(uname -m)" in
            x86_64|amd64) ;;
            *)
              echo "The deployment images target linux/amd64, but this VPS is $(uname -m)."
              exit 1
              ;;
          esac

          if ! command -v systemctl >/dev/null 2>&1; then
            echo "K3s bootstrap requires a systemd-based VPS."
            exit 1
          fi

          if ! command -v k3s >/dev/null 2>&1 \
            || ! run_root systemctl list-unit-files k3s.service --no-legend 2>/dev/null \
              | grep -q '^k3s.service'; then
            command -v curl >/dev/null 2>&1
            curl -sfL https://get.k3s.io -o /tmp/falzo-install-k3s.sh
            run_root sh /tmp/falzo-install-k3s.sh
            rm -f /tmp/falzo-install-k3s.sh
          fi

          if ! run_root systemctl list-unit-files k3s.service --no-legend 2>/dev/null \
            | grep -q '^k3s.service'; then
            echo "K3s installation finished without creating k3s.service."
            exit 1
          fi

          # A previous install can leave the binary present while the server is
          # stopped. Start the service before asking kubectl to use localhost:6443.
          if ! run_root systemctl enable --now k3s; then
            exit 1
          fi

          kube() {
            run_root k3s kubectl \
              --kubeconfig /etc/rancher/k3s/k3s.yaml \
              "$@"
          }

          wait_for_api() {
            for attempt in $(seq 1 60); do
              if run_root systemctl is-active --quiet k3s \
                && kube get --raw=/readyz >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            echo "K3s API did not become ready on 127.0.0.1:6443."
            return 1
          }

          wait_for_traefik() {
            for attempt in $(seq 1 90); do
              if ! run_root systemctl is-active --quiet k3s \
                || ! kube get --raw=/readyz >/dev/null 2>&1; then
                # systemd normally restarts K3s automatically. Keep waiting
                # through a transient restart instead of failing immediately.
                run_root systemctl start k3s >/dev/null 2>&1 || true
                sleep 2
                continue
              fi

              traefik_deployments="$(
                kube get deployment \
                  -n kube-system \
                  -l app.kubernetes.io/name=traefik \
                  -o name \
                  2>/dev/null || true
              )"
              if kube get ingressclass traefik >/dev/null 2>&1 \
                && [ -n "$traefik_deployments" ] \
                && kube wait \
                  --for=condition=Available \
                  deployment \
                  -n kube-system \
                  -l app.kubernetes.io/name=traefik \
                  --timeout=5s \
                  >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done

            echo "K3s and Traefik did not stabilize within 180 seconds."
            kube get pods,deploy -n kube-system || true
            return 1
          }

          wait_for_api
          kube wait --for=condition=Ready node --all --timeout=180s
          wait_for_traefik

          # Re-check the API after the bundled add-ons have settled. This catches
          # a K3s process that starts briefly and then exits during bootstrap.
          if ! run_root systemctl is-active --quiet k3s \
            || ! kube get --raw=/readyz >/dev/null 2>&1; then
            echo "K3s became unavailable after Traefik initialization."
            exit 1
          fi

          kube get pods -n kube-system -l app.kubernetes.io/name=traefik
          kube get ingressclass traefik
          kube get storageclass local-path

          kube apply -f "$REMOTE_DIR/platform/namespace.yaml"
          kube apply -f "$REMOTE_DIR/ci/rbac.yaml"

          if ! kube get secret falzo-secrets -n falzo >/dev/null 2>&1; then
            database_password="$(openssl rand -hex 32)"
            redis_password="$(openssl rand -hex 32)"
            jwt_secret="$(openssl rand -hex 48)"
            database_url="postgres://falzo_user:${database_password}@falzo-postgres:5432/falzo_game_db?sslmode=disable"

            kube create secret generic falzo-secrets \
              --namespace falzo \
              --from-literal=DATABASE_PASSWORD="$database_password" \
              --from-literal=REDIS_PASSWORD="$redis_password" \
              --from-literal=JWT_SECRET="$jwt_secret" \
              --from-literal=DATABASE_URL="$database_url"

            unset database_password redis_password jwt_secret database_url
          fi

          if ! kube get secret falzo-tls -n falzo >/dev/null 2>&1; then
            tls_dir="$(mktemp -d)"
            openssl req -x509 -nodes -newkey rsa:2048 \
              -keyout "$tls_dir/tls.key" \
              -out "$tls_dir/tls.crt" \
              -days 30 \
              -subj "/CN=falzo.life" \
              -addext "subjectAltName=DNS:falzo.life"
            kube create secret tls falzo-tls \
              --namespace falzo \
              --cert="$tls_dir/tls.crt" \
              --key="$tls_dir/tls.key"
            rm -rf -- "$tls_dir"
            echo "Created a temporary self-signed TLS certificate. Replace it after DNS is configured."
          fi

          kube get nodes
          kube get secret falzo-secrets falzo-tls -n falzo
          EOF
